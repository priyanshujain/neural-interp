[project]
name = "neural-interp"
version = "0.1.0"
description = "Neuron-level clustering of what drives a unit to fire"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "captum>=0.8",
    "networkx>=3.4",
    "nltk>=3.9",
    "numpy>=2.0",
    "pillow>=11.0",
    "plotly>=5.20",
    "scipy>=1.13",
    "torch>=2.6",
    "torch-lucent>=0.1.8",
]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
