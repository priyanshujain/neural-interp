[project]
name = "neural-interp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.3.0",
    "in-tfm",
    "nltk>=3.10.4",
    "plotly>=7.1.0",
    "safetensors>=0.8.0",
    "scipy>=1.18.1",
    "transformers>=5.20.2",
]

[project.scripts]
nint = "neural_interp.cli:main"

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv.sources]
in-tfm = { git = "https://github.com/narang99/in-tfm.git", rev = "feat/bucket-report" }

[tool.pyright]
venvPath = "."
venv = ".venv"
