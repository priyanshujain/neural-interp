[project]
name = "neural-interp"
version = "0.1.0"
description = "Neuron-level clustering of what drives a unit to fire"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "captum>=0.8",
    "networkx>=3.4",
    "numpy>=2.0",
    "pillow>=11.0",
    "plotly>=5.20",
    "scipy>=1.13",
    "torch>=2.6",
]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
